<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2358a6ff'/%3E%3Cpath d='M8 22l5-7 4 4 7-10' fill='none' stroke='%230d1117' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Screener</title>
<script src="https://unpkg.com/lightweight-charts@4.1.1/dist/lightweight-charts.standalone.production.js"></script>
<style>
  :root { --bg:#0d1117; --surface:#161b22; --border:#30363d;
          --text:#e6edf3; --muted:#8b949e; --accent:#58a6ff;
          --green:#3fb950; --red:#f85149; --yellow:#d29922; --orange:#db6d28; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
         background:var(--bg); color:var(--text); min-height:100vh; }

  /* Control bar */
  .ctrl-bar { background:var(--surface); border-bottom:1px solid var(--border);
              padding:10px 20px; display:flex; align-items:center; gap:20px; flex-wrap:wrap; }
  .ctrl-group { display:flex; align-items:center; gap:8px; }
  .ctrl-label { font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:0.5px; white-space:nowrap; }
  .pill-group { display:flex; gap:4px; flex-wrap:wrap; }
  .pill { padding:4px 11px; border-radius:100px; font-size:11px; font-weight:600;
          border:1px solid var(--border); background:transparent; color:var(--muted);
          cursor:pointer; transition:all 0.15s; }
  .pill:hover { border-color:var(--muted); color:var(--text); }
  .pill.active { border-color:var(--accent); color:var(--accent); background:rgba(88,166,255,0.1); }
  .pill.active.bull { border-color:var(--green); color:var(--green); background:rgba(63,185,80,0.1); }
  .pill.active.bear { border-color:var(--red); color:var(--red); background:rgba(248,81,73,0.1); }
  .run-area { margin-left:auto; display:flex; align-items:center; gap:8px; }
  #last-scan { font-size:11px; color:var(--muted); white-space:nowrap; }
  #run-btn { padding:7px 18px; background:var(--accent); border:none;
             border-radius:6px; color:#fff; font-size:13px; font-weight:600;
             cursor:pointer; display:flex; align-items:center; gap:6px; white-space:nowrap; }
  #run-btn:hover { background:#4a9aef; }
  #run-btn:disabled { opacity:0.5; cursor:not-allowed; }
  #cancel-btn { padding:7px 18px; background:transparent; border:1px solid var(--red);
                border-radius:6px; color:var(--red); font-size:13px; font-weight:600;
                cursor:pointer; display:none; white-space:nowrap; }
  #cancel-btn:hover { background:rgba(248,81,73,0.1); }
  .btn-spinner { width:12px; height:12px; border:2px solid rgba(255,255,255,0.3);
                 border-top-color:#fff; border-radius:50%;
                 animation:spin 0.7s linear infinite; display:none; }

  /* Progress bar */
  #prog-bar { background:var(--surface); border-bottom:1px solid var(--border);
              padding:8px 20px; display:none; align-items:center; gap:12px; }
  #prog-bar.visible { display:flex; }
  .prog-track { flex:1; height:4px; background:var(--border); border-radius:2px; overflow:hidden; }
  .prog-fill { height:100%; background:var(--accent); border-radius:2px; transition:width 0.3s; width:0%; }
  #prog-msg { font-size:12px; color:var(--muted); min-width:260px; }

  /* Results header */
  #results-hdr { background:var(--surface); border-bottom:1px solid var(--border);
                 padding:0 20px; display:none; align-items:stretch; justify-content:space-between; }
  #results-hdr.visible { display:flex; }
  .tabs { display:flex; overflow-x:auto; scrollbar-width:none; }
  .tabs::-webkit-scrollbar { display:none; }
  .tab { padding:10px 14px; cursor:pointer; color:var(--muted); font-size:12px; font-weight:600;
         border-bottom:2px solid transparent; transition:all 0.15s; white-space:nowrap; }
  .tab:hover { color:var(--text); }
  .tab.active { color:var(--accent); border-bottom-color:var(--accent); }
  .tab .cnt { display:inline-block; background:var(--border); color:var(--muted);
              font-size:10px; padding:1px 5px; border-radius:8px; margin-left:4px; }
  .tab.active .cnt { background:rgba(88,166,255,0.2); color:var(--accent); }
  .view-toggle { display:flex; align-items:center; gap:4px; padding:8px 0; }
  .vbtn { padding:4px 10px; font-size:11px; font-weight:600; border:1px solid var(--border);
          background:transparent; color:var(--muted); cursor:pointer; border-radius:4px; transition:all 0.15s; }
  .vbtn:hover { color:var(--text); }
  .vbtn.active { color:var(--accent); border-color:var(--accent); background:rgba(88,166,255,0.1); }

  /* Main */
  main { padding:14px 20px; }
  #summary { display:flex; gap:20px; margin-bottom:12px; font-size:12px; color:var(--muted); }
  #summary strong { color:var(--text); }

  /* Table */
  .rtable { width:100%; border-collapse:collapse; font-size:13px; }
  .rtable th { text-align:left; padding:8px 12px; font-size:11px; font-weight:600;
               color:var(--muted); text-transform:uppercase; letter-spacing:0.4px;
               border-bottom:1px solid var(--border); cursor:pointer; user-select:none; white-space:nowrap; }
  .rtable th:hover { color:var(--text); }
  .rtable th .sa { margin-left:3px; opacity:0.35; }
  .rtable th.sorted .sa { opacity:1; color:var(--accent); }
  .rtable td { padding:8px 12px; border-bottom:1px solid rgba(48,54,61,0.5); }
  .rtable tbody tr:hover td { background:rgba(255,255,255,0.03); cursor:pointer; }
  .rtable tbody tr.bull td:first-child { border-left:2px solid var(--green); padding-left:10px; }
  .rtable tbody tr.bear td:first-child { border-left:2px solid var(--red); padding-left:10px; }
  .tk { font-weight:700; color:var(--accent); }
  .badge { display:inline-block; font-size:10px; font-weight:700; padding:2px 6px; border-radius:4px; }
  .bull-triggered { background:rgba(63,185,80,0.2); color:var(--green); }
  .bull-forming   { background:rgba(210,153,34,0.2); color:var(--yellow); }
  .bear-triggered { background:rgba(248,81,73,0.2); color:var(--red); }
  .bear-forming   { background:rgba(219,109,40,0.2); color:var(--orange); }
  .bull-g { background:rgba(63,185,80,0.15); color:var(--green); }
  .bear-g { background:rgba(248,81,73,0.15); color:var(--red); }
  .pos { color:var(--green); }
  .neg { color:var(--red); }
  .muted { color:var(--muted); }

  /* Chart grid */
  .cgrid { display:grid; grid-template-columns:repeat(auto-fill, minmax(360px,1fr)); gap:12px; }
  .ccard { background:var(--surface); border:1px solid var(--border); border-radius:8px;
           overflow:hidden; cursor:pointer; transition:border-color 0.15s; }
  .ccard:hover { border-color:var(--accent); }
  .ccard-hdr { padding:9px 12px; display:flex; justify-content:space-between;
               align-items:flex-start; border-bottom:1px solid var(--border); }
  .ccard-body { height:200px; }
  .cmeta { display:flex; flex-direction:column; align-items:flex-end; gap:5px; font-size:11px; color:var(--muted); }
  .ccard-left { display:flex; flex-direction:column; gap:3px; }

  /* Empty */
  .empty { text-align:center; padding:60px 20px; color:var(--muted); font-size:14px; }

  /* Modal */
  .moverlay { display:none; position:fixed; inset:0; z-index:1000;
              background:rgba(0,0,0,0.85); align-items:center; justify-content:center; }
  .moverlay.open { display:flex; }
  .modal { background:var(--surface); border:1px solid var(--border); border-radius:10px;
           width:92vw; max-width:1100px; }
  .mhdr { display:flex; align-items:center; justify-content:space-between;
          padding:14px 18px; border-bottom:1px solid var(--border); }
  .mhdr h2 { font-size:17px; font-weight:700; }
  .mtf { display:flex; gap:10px; padding:10px 18px; flex-wrap:wrap; align-items:center; }
  .tf-grp { display:flex; gap:4px; align-items:center; }
  .tf-lbl { font-size:11px; color:var(--muted); margin-right:2px; }
  .tf-btn { padding:3px 9px; font-size:11px; border:1px solid var(--border);
            background:transparent; color:var(--muted); border-radius:4px; cursor:pointer; }
  .tf-btn:hover { color:var(--text); }
  .tf-btn.active { color:var(--accent); border-color:var(--accent); background:rgba(88,166,255,0.1); }
  .mchart { height:480px; }
  .xbtn { background:none; border:none; font-size:22px; color:var(--muted); cursor:pointer; padding:0 4px; }
  .xbtn:hover { color:var(--text); }
  .tvlnk { color:var(--accent); font-size:12px; text-decoration:none; }
  .tvlnk:hover { text-decoration:underline; }
  .mspin { width:28px; height:28px; border:3px solid var(--border); border-top-color:var(--accent);
           border-radius:50%; animation:spin 0.8s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }

  /* Bull/bear tab counts */
  .cnt-b { display:inline-block; background:rgba(63,185,80,0.15); color:var(--green);
           font-size:10px; font-weight:700; padding:1px 5px; border-radius:8px; }
  .cnt-r { display:inline-block; background:rgba(248,81,73,0.15); color:var(--red);
           font-size:10px; font-weight:700; padding:1px 5px; border-radius:8px; }
  /* Inline ticker filter */
  #ticker-filter { padding:3px 8px; background:var(--bg); border:1px solid var(--border);
                   border-radius:5px; color:var(--text); font-size:12px; width:110px; }
  #ticker-filter:focus { outline:none; border-color:var(--accent); }
  #ticker-filter::placeholder { color:var(--muted); }
  /* EMA zone dot */
  .zone-dot { display:inline-block; width:6px; height:6px; border-radius:50%;
              background:var(--green); margin-left:4px; vertical-align:middle; }
  /* Watchlist star */
</style>
</head>
<body>

<!-- Controls -->
<div class="ctrl-bar">
  <div class="ctrl-group">
    <span class="ctrl-label">Universe</span>
    <div class="pill-group" id="uni-pills">
      <button class="pill active" data-val="spy">S&amp;P 500</button>
      <button class="pill" data-val="qqq">Nasdaq 100</button>
    </div>
  </div>
  <div class="ctrl-group">
    <span class="ctrl-label">Side</span>
    <div class="pill-group" id="side-pills">
      <button class="pill active" data-val="both">Both</button>
      <button class="pill bull" data-val="bull">Bull</button>
      <button class="pill bear" data-val="bear">Bear</button>
    </div>
  </div>
  <div class="run-area"><span id="last-scan"></span></div>
</div>

<!-- Chart grid timeframe bar (visible only in chart view) -->
<div id="grid-tf-bar" style="display:none; background:var(--surface); border-bottom:1px solid var(--border); padding:8px 20px; align-items:center; gap:16px; flex-wrap:wrap;">
  <div class="tf-grp">
    <span class="tf-lbl">Interval</span>
    <button class="tf-btn active" data-interval="1d" data-range="6mo">Daily</button>
    <button class="tf-btn" data-interval="1wk" data-range="5y">Weekly</button>
    <button class="tf-btn" data-interval="1mo" data-range="5y">Monthly</button>
  </div>
  <div class="tf-grp">
    <span class="tf-lbl">Range</span>
    <button class="tf-btn" data-range="1mo">1M</button>
    <button class="tf-btn" data-range="3mo">3M</button>
    <button class="tf-btn active" data-range="6mo">6M</button>
    <button class="tf-btn" data-range="1y">1Y</button>
    <button class="tf-btn" data-range="5y">5Y</button>
  </div>
</div>

<!-- Results header (tabs + view toggle) -->
<div id="results-hdr">
  <div class="tabs" id="tabs"></div>
  <div class="view-toggle">
    <input id="ticker-filter" placeholder="Filter ticker..." oninput="if(currentView==='table') renderActiveTab()">
    <button class="vbtn active" id="vbtn-table" onclick="setView('table')">&#8801; Table</button>
    <button class="vbtn" id="vbtn-charts" onclick="setView('charts')">&#8862; Charts</button>
  </div>
</div>

<!-- Main content -->
<main>
  <div id="summary"></div>
  <div id="content"></div>
  <p class="muted" style="font-size:12px;padding:24px 4px 8px;line-height:1.6">
    Results are a snapshot, rebuilt each weekday after the US market closes, from Yahoo Finance prices,
    TradingView's screener data and Wikipedia's index lists. Informational only, not investment advice.
  </p>
</main>

<!-- Modal -->
<div class="moverlay" id="moverlay">
  <div class="modal">
    <div class="mhdr">
      <div style="display:flex;align-items:center;gap:10px">
        <h2 id="mtitle"></h2>
        <a id="mtvlnk" class="tvlnk" href="#" target="_blank">&#8599; TradingView</a>
      </div>
      <button class="xbtn" onclick="closeModal()">&times;</button>
    </div>
    <div class="mtf" id="mtf">
      <div class="tf-grp">
        <span class="tf-lbl">Interval</span>
        <button class="tf-btn active" data-interval="1d" data-range="6mo">Daily</button>
        <button class="tf-btn" data-interval="1wk" data-range="5y">Weekly</button>
        <button class="tf-btn" data-interval="1mo" data-range="5y">Monthly</button>
      </div>
      <div class="tf-grp">
        <span class="tf-lbl">Range</span>
        <button class="tf-btn" data-range="1mo">1M</button>
        <button class="tf-btn" data-range="3mo">3M</button>
        <button class="tf-btn active" data-range="6mo">6M</button>
        <button class="tf-btn" data-range="1y">1Y</button>
        <button class="tf-btn" data-range="5y">5Y</button>
      </div>
    </div>
    <div class="mchart" id="mchart"></div>
  </div>
</div>

<script>
// ── State ─────────────────────────────────────────────────────────────────
var scanData      = null;
var cacheTimestamp = null;
var scanCoverage = null, scanMissing = 0;
var activeTab     = null;
var currentView   = 'table';
var sortCol       = 'entry_score';
var sortAsc       = false;
var rawData       = null;
var universe      = 'spy';
var side          = 'both';
var gridInterval  = '1d';
var gridRange     = '6mo';

// ── Helpers ───────────────────────────────────────────────────────────────
function fmtAgo(isoStr) {
  try {
    var d   = new Date(isoStr);
    var sec = Math.floor((Date.now() - d) / 1000);
    if (sec < 60)  return sec + 's ago';
    if (sec < 3600) return Math.floor(sec / 60) + 'm ago';
    var h = Math.floor(sec / 3600);
    if (h >= 48) return Math.floor(h / 24) + ' days ago';
    return h + 'h ago';
  } catch(e) { return ''; }
}

function setLastScan(isoStr) {
  var el = document.getElementById('last-scan');
  if (!el || !isoStr) return;
  el.textContent = 'Snapshot from ' + new Date(isoStr).toLocaleString([], {month:'short', day:'numeric', hour:'numeric', minute:'2-digit'});
  el.title = fmtAgo(isoStr);
}

// ── Data: daily snapshots instead of a live server ────────────────────────
function applySide() {
  scanData = {};
  Object.keys(rawData).forEach(function(k) {
    var d = rawData[k];
    scanData[k] = {
      display_name: d.display_name, scanned: d.scanned,
      results: (d.results || []).filter(function(r) {
        return side === 'both' || (side === 'bull' ? r.type === 'bullish' : r.type === 'bearish');
      }),
    };
  });
}

function loadUniverse(u) {
  document.getElementById('content').innerHTML = '<div class="empty">Loading...</div>';
  fetch('data/screener_' + u + '.json')
    .then(function(r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(function(c) {
      universe = u;
      rawData = c.data;
      cacheTimestamp = c.timestamp;
      scanCoverage = c.coverage; scanMissing = c.missing || 0;
      setLastScan(c.timestamp);
      applySide();
      renderResults();
    })
    .catch(function() {
      document.getElementById('content').innerHTML =
        '<div class="empty">Could not load the latest results. Please refresh in a moment.</div>';
    });
}

// Price history comes from one small file per ticker (5 years of daily bars);
// weekly and monthly bars and the visible range are worked out here in the browser.
var _seriesCache = {};
var _RANGE_DAYS = {'1mo': 31, '3mo': 92, '6mo': 183, '1y': 366, '5y': 1830};

function _loadSeries(ticker) {
  if (!_seriesCache[ticker]) {
    _seriesCache[ticker] = fetch('data/charts/' + encodeURIComponent(ticker) + '.json')
      .then(function(r) { if (!r.ok) throw new Error('No chart data for ' + ticker); return r.json(); })
      .then(function(c) {
        return c.d.map(function(day, i) {
          return {time: day, open: c.o[i], high: c.h[i], low: c.l[i], close: c.c[i], volume: c.v[i]};
        });
      });
  }
  return _seriesCache[ticker];
}

function _bucket(day, interval) {
  if (interval === '1mo') return day.slice(0, 7) + '-01';
  var d = new Date(day + 'T00:00:00Z');
  d.setUTCDate(d.getUTCDate() - ((d.getUTCDay() + 6) % 7));   // Monday of that week
  return d.toISOString().slice(0, 10);
}

function getChart(ticker, interval, range) {
  return _loadSeries(ticker).then(function(daily) {
    var bars = daily;
    if (interval === '1wk' || interval === '1mo') {
      var out = [], cur = null;
      daily.forEach(function(b) {
        var key = _bucket(b.time, interval);
        if (!cur || cur.time !== key) {
          cur = {time: key, open: b.open, high: b.high, low: b.low, close: b.close, volume: b.volume};
          out.push(cur);
        } else {
          cur.high = Math.max(cur.high, b.high); cur.low = Math.min(cur.low, b.low);
          cur.close = b.close; cur.volume += b.volume;
        }
      });
      bars = out;
    }
    var days = _RANGE_DAYS[range];
    if (days && bars.length) {
      var last = new Date(bars[bars.length - 1].time + 'T00:00:00Z');
      last.setUTCDate(last.getUTCDate() - days);
      var cutoff = last.toISOString().slice(0, 10);
      bars = bars.filter(function(b) { return b.time >= cutoff; });
    }
    return bars;
  });
}

// ── Init ──────────────────────────────────────────────────────────────────
(function init() {
  document.getElementById('uni-pills').addEventListener('click', function(e) {
    var btn = e.target.closest('.pill');
    if (!btn || btn.classList.contains('active')) return;
    this.querySelectorAll('.pill').forEach(function(b) { b.classList.remove('active'); });
    btn.classList.add('active');
    loadUniverse(btn.dataset.val);
  });
  document.getElementById('side-pills').addEventListener('click', function(e) {
    var btn = e.target.closest('.pill');
    if (!btn || btn.classList.contains('active')) return;
    this.querySelectorAll('.pill').forEach(function(b) { b.classList.remove('active'); });
    btn.classList.add('active');
    side = btn.dataset.val;
    if (rawData) { applySide(); renderResults(); }
  });
  loadUniverse('spy');
})();

// ── Grid timeframe bar ────────────────────────────────────────────────────
document.getElementById('grid-tf-bar').addEventListener('click', function(e) {
  var btn = e.target.closest('.tf-btn');
  if (!btn) return;
  var grp = btn.closest('.tf-grp');
  var isIntervalGrp = grp === grp.parentElement.firstElementChild;
  if (isIntervalGrp) {
    gridInterval = btn.dataset.interval;
    gridRange    = btn.dataset.range;
    grp.querySelectorAll('.tf-btn').forEach(function(b) { b.classList.remove('active'); });
    btn.classList.add('active');
    grp.nextElementSibling.querySelectorAll('.tf-btn').forEach(function(b) {
      b.classList.toggle('active', b.dataset.range === gridRange);
    });
  } else {
    gridRange = btn.dataset.range;
    grp.querySelectorAll('.tf-btn').forEach(function(b) { b.classList.remove('active'); });
    btn.classList.add('active');
  }
  renderActiveTab();
});

// ── Render ────────────────────────────────────────────────────────────────
function renderResults() {
  if (!scanData) return;

  var keys = Object.keys(scanData);
  if (!keys.length) {
    document.getElementById('content').innerHTML = '<div class="empty">No results</div>';
    return;
  }

  // Summary
  var total = 0, scanned = 0;
  keys.forEach(function(k) {
    total   += (scanData[k].results || []).length;
    scanned = Math.max(scanned, scanData[k].scanned || 0);
  });
  var sumEl = document.getElementById('summary');
  sumEl.style.display = 'flex';
  var timeStr = cacheTimestamp
    ? new Date(cacheTimestamp).toLocaleString([], {month:'short', day:'numeric', hour:'numeric', minute:'2-digit'})
    : '';
  var covHtml = (scanMissing && scanMissing > 0)
    ? '<span title="Tickers that failed to download and were not evaluated" style="color:var(--yellow)">⚠ ' +
      scanMissing + ' tickers unavailable (' + (scanCoverage != null ? scanCoverage : '?') + '% coverage)</span>'
    : '';
  sumEl.innerHTML =
    '<span><strong>' + total + '</strong> setups</span>' +
    '<span><strong>' + scanned + '</strong> tickers scanned</span>' +
    '<span><strong>' + keys.length + '</strong> screeners</span>' +
    covHtml +
    '<span style="margin-left:auto">as of <strong>' + timeStr + '</strong></span>';

  // Tabs
  var tabsEl = document.getElementById('tabs');
  tabsEl.innerHTML = '';
  keys.forEach(function(key, idx) {
    var d   = scanData[key];
    var tab = document.createElement('div');
    tab.className  = 'tab' + (idx === 0 ? ' active' : '');
    tab.dataset.key = key;
    var res = d.results || [];
    var nBull = res.filter(function(r) { return r.type === 'bullish'; }).length;
    var nBear = res.filter(function(r) { return r.type === 'bearish'; }).length;
    var cntHtml = nBull > 0 && nBear > 0
      ? '<span class="cnt-b">' + nBull + '</span><span class="muted" style="font-size:10px;padding:0 2px">/</span><span class="cnt-r">' + nBear + '</span>'
      : nBull > 0 ? '<span class="cnt-b">' + nBull + '</span>'
      : '<span class="cnt-r">' + nBear + '</span>';
    tab.innerHTML = d.display_name + ' ' + cntHtml;
    tab.onclick = function() {
      document.querySelectorAll('.tab').forEach(function(t) { t.classList.remove('active'); });
      tab.classList.add('active');
      activeTab = key;
      renderActiveTab();
    };
    tabsEl.appendChild(tab);
  });

  document.getElementById('results-hdr').classList.add('visible');
  // Default to the first tab that actually has results so the user doesn't land
  // on an empty "No setups found" view. All tabs (including 0-count) stay visible.
  var firstWithResults = keys.find(function(k) { return (scanData[k].results || []).length > 0; });
  activeTab = firstWithResults || keys[0];
  document.querySelectorAll('.tab').forEach(function(t) {
    t.classList.toggle('active', t.dataset.key === activeTab);
  });
  renderActiveTab();
}

function renderActiveTab() {
  if (!activeTab || !scanData[activeTab]) return;
  var results = scanData[activeTab].results || [];
  var el = document.getElementById('content');
  if (!results.length) {
    el.innerHTML = '<div class="empty">No setups found for ' + scanData[activeTab].display_name + '</div>';
    return;
  }
  if (currentView === 'table') renderTable(results, el);
  else                         renderChartGrid(activeTab, results, el);
}

function setView(v) {
  currentView = v;
  document.getElementById('vbtn-table').classList.toggle('active',  v === 'table');
  document.getElementById('vbtn-charts').classList.toggle('active', v === 'charts');
  document.getElementById('grid-tf-bar').style.display = v === 'charts' ? 'flex' : 'none';
  renderActiveTab();
}

// ── Table ─────────────────────────────────────────────────────────────────
var COLS = [
  { key: 'ticker',        label: 'Ticker',       sort: 'str', fmt: function(v)    { return '<span class="tk">' + v + '</span>'; } },
  { key: 'price',         label: 'Price',        sort: 'num', fmt: function(v)    { return '$' + (v || 0).toFixed(2); } },
  { key: '_signal',       label: 'Signal',       sort: 'str', fmt: fmtSignal },
  { key: '_type',         label: 'Type',         sort: 'str', fmt: fmtType },
  { key: 'entry_score', label: 'Entry', sort: 'num', fmt: function(v) {
    if (v == null) return '<span class="muted">-</span>';
    var col = v >= 78 ? 'var(--green)' : v >= 60 ? 'var(--yellow)' : v >= 40 ? 'var(--orange)' : 'var(--muted)';
    var pct = Math.min(100, Math.max(0, v));
    return '<div style="display:flex;align-items:center;gap:6px">' +
      '<span style="color:' + col + ';min-width:22px;font-weight:700">' + v + '</span>' +
      '<div style="width:44px;height:4px;background:var(--border);border-radius:2px">' +
      '<div style="width:' + pct + '%;height:4px;background:' + col + ';border-radius:2px"></div>' +
      '</div></div>';
  }},
  { key: 'trend_score', label: 'Trend', sort: 'num', fmt: function(v) {
    if (v == null) return '<span class="muted">-</span>';
    var col = v >= 80 ? 'var(--green)' : v >= 55 ? 'var(--yellow)' : 'var(--muted)';
    return '<span style="color:' + col + ';font-weight:600">' + v + '</span>';
  }},
  { key: 'setup', label: 'Setup', sort: 'str', fmt: function(v) {
    if (!v) return '<span class="muted">-</span>';
    return '<span style="color:var(--text);font-size:12px">' + v + '</span>';
  }},
  { key: 'rs', label: 'RS vs SPY', sort: 'num', fmt: function(v) {
    if (v == null) return '-';
    var str = (v >= 0 ? '+' : '') + v.toFixed(1);
    var pct = Math.min(100, Math.max(0, ((v + 30) / 60) * 100));
    var col = v >= 0 ? 'var(--green)' : 'var(--red)';
    return '<div style="display:flex;align-items:center;gap:6px">' +
      '<span style="color:' + col + ';min-width:36px;font-weight:600">' + str + '</span>' +
      '<div style="width:52px;height:4px;background:var(--border);border-radius:2px">' +
      '<div style="width:' + pct.toFixed(0) + '%;height:4px;background:' + col + ';border-radius:2px"></div>' +
      '</div></div>';
  }},
  { key: 'pct_from_8ema', label: '% from 8 EMA', sort: 'num', fmt: function(v) {
    if (v == null) return '-';
    var str = (v >= 0 ? '+' : '') + v.toFixed(1) + '%';
    var abs = Math.abs(v);
    var col = abs <= 3 ? 'var(--green)' : abs <= 7 ? 'var(--yellow)' : 'var(--muted)';
    var dot = abs <= 3 ? ' <span class="zone-dot"></span>' : '';
    return '<span style="color:' + col + '">' + str + dot + '</span>';
  }},
  { key: '_days',         label: 'Cross / Gap',  sort: 'num', fmt: function(v)    { return v == null ? '-' : v + 'd'; } },
];

function colVal(r, key) {
  if (key === '_signal') return r.signal || r.type || '';
  if (key === '_type')   return r.type   || '';
  if (key === '_days')   return r.cross_bars_ago != null ? r.cross_bars_ago
                                : (r.days_since_gap != null ? r.days_since_gap : null);
  return r[key] != null ? r[key] : null;
}

function fmtSignal(v, r) {
  if (!v) return '-';
  var sig = (r.signal || '').toLowerCase();
  var typ = (r.type   || '').toLowerCase();
  var cls = (typ === 'bullish' ? 'bull' : 'bear') + '-' + (sig === 'triggered' ? 'triggered' : 'forming');
  var lbl = sig === 'triggered' ? 'TRIGGERED' : (sig === 'forming' ? 'FORMING' : v.toUpperCase());
  return '<span class="badge ' + cls + '">' + lbl + '</span>';
}

function fmtType(v, r) {
  if (!v) return '-';
  return '<span class="badge ' + (v === 'bullish' ? 'bull-g' : 'bear-g') + '">' + v.toUpperCase() + '</span>';
}

function sortRows(rows) {
  var col = COLS.find(function(c) { return c.key === sortCol; });
  if (!col || col.sort === 'none') return rows.slice();
  return rows.slice().sort(function(a, b) {
    var av = colVal(a, sortCol), bv = colVal(b, sortCol);
    if (av == null && bv == null) return 0;
    if (av == null) return 1;
    if (bv == null) return -1;
    var cmp = col.sort === 'num' ? (av - bv) : String(av).localeCompare(String(bv));
    return sortAsc ? cmp : -cmp;
  });
}

function renderTable(results, container) {
  var filter = ((document.getElementById('ticker-filter') || {}).value || '').trim().toUpperCase();
  var visible = filter ? results.filter(function(r) { return r.ticker.indexOf(filter) !== -1; }) : results;
  var sorted = sortRows(visible);
  var html = '<table class="rtable"><thead><tr>';
  COLS.forEach(function(col) {
    var isSorted = sortCol === col.key;
    var arrow = '<span class="sa">' + (isSorted ? (sortAsc ? '&#8593;' : '&#8595;') : '&#8597;') + '</span>';
    html += '<th class="' + (isSorted ? 'sorted' : '') + '" data-col="' + col.key + '">'
          + col.label + arrow + '</th>';
  });
  html += '</tr></thead><tbody>';
  sorted.forEach(function(r) {
    var rowCls = r.type === 'bullish' ? 'bull' : (r.type === 'bearish' ? 'bear' : '');
    html += '<tr class="' + rowCls + '" data-ticker="' + r.ticker + '">';
    COLS.forEach(function(col) {
      var raw = colVal(r, col.key);
      var cell = col.fmt ? col.fmt(raw, r) : (raw != null ? raw : '-');
      var cls = '';
      if ((col.key === 'rs' || col.key === 'pct_from_8ema') && raw != null)
        cls = raw >= 0 ? 'pos' : 'neg';
      html += '<td class="' + cls + '">' + cell + '</td>';
    });
    html += '</tr>';
  });
  html += '</tbody></table>';
  container.innerHTML = html;

  container.querySelectorAll('th[data-col]').forEach(function(th) {
    th.onclick = function() {
      var c = th.dataset.col;
      if (sortCol === c) { sortAsc = !sortAsc; } else { sortCol = c; sortAsc = c === 'ticker'; }
      renderActiveTab();
    };
  });
  container.querySelectorAll('tr[data-ticker]').forEach(function(tr) {
    tr.onclick = function() { openModal(tr.dataset.ticker); };
  });
}

// ── Chart grid ────────────────────────────────────────────────────────────
function calcEMA(closes, p) {
  var k = 2 / (p + 1), ema = [closes[0]];
  for (var i = 1; i < closes.length; i++) ema.push(closes[i] * k + ema[i-1] * (1-k));
  return ema;
}

function renderChartGrid(tabKey, results, container) {
  var html = '<div class="cgrid">';
  results.forEach(function(r) {
    var isBull = r.type === 'bullish';
    var isTrig = r.signal === 'triggered';
    var sigUp  = (r.signal || 'triggered').toUpperCase();
    var bcls = (isBull ? 'bull' : 'bear') + '-' + (isTrig ? 'triggered' : 'forming');
    var blbl = (isBull ? 'BULL ' : 'BEAR ') + (isTrig ? 'TRIGGERED' : sigUp);

    // RS bar
    var rsVal  = r.rs != null ? r.rs : null;
    var rsStr  = rsVal != null ? (rsVal >= 0 ? '+' : '') + rsVal.toFixed(1) : null;
    var rsPct  = rsVal != null ? Math.min(100, Math.max(0, ((rsVal + 30) / 60) * 100)) : 0;
    var rsCol  = rsVal != null && rsVal >= 0 ? 'var(--green)' : 'var(--red)';
    var rsHtml = rsStr
      ? '<div style="display:flex;align-items:center;gap:4px">' +
          '<span style="color:' + rsCol + ';font-size:11px;font-weight:600;min-width:30px">' + rsStr + '</span>' +
          '<div style="width:40px;height:3px;background:var(--border);border-radius:2px">' +
            '<div style="width:' + rsPct.toFixed(0) + '%;height:3px;background:' + rsCol + ';border-radius:2px"></div>' +
          '</div></div>'
      : '<span style="color:var(--muted);font-size:11px">RS —</span>';

    // EMA proximity
    var emaVal = r.pct_from_8ema;
    var emaAbs = emaVal != null ? Math.abs(emaVal) : 99;
    var emaCol = emaAbs <= 3 ? 'var(--green)' : emaAbs <= 7 ? 'var(--yellow)' : 'var(--muted)';
    var emaDot = emaAbs <= 3 ? '● ' : '';
    var emaHtml = emaVal != null
      ? '<span style="font-size:11px;color:' + emaCol + '">' + emaDot + (emaVal >= 0 ? '+' : '') + emaVal.toFixed(1) + '% 8EMA</span>'
      : '';

    html +=
      '<div class="ccard" data-ticker="' + r.ticker + '">' +
        '<div class="ccard-hdr">' +
          '<div class="ccard-left">' +
            '<div><span style="font-size:14px;font-weight:700;color:var(--accent)">' + r.ticker + '</span>' +
            ' <span style="font-size:12px;color:var(--muted)">$' + (r.price || 0).toFixed(2) + '</span>' +
            '</div>' +
            emaHtml +
          '</div>' +
          '<div class="cmeta">' +
            '<span class="badge ' + bcls + '">' + blbl + '</span>' +
            rsHtml +
          '</div>' +
        '</div>' +
        '<div class="ccard-body" id="cc-' + tabKey + '-' + r.ticker + '" data-ticker="' + r.ticker + '"></div>' +
      '</div>';
  });
  html += '</div>';
  container.innerHTML = html;

  container.querySelectorAll('.ccard').forEach(function(c) {
    c.onclick = function() { openModal(c.dataset.ticker); };
  });

  // Lazy-load charts as cards scroll into view. Rendering hundreds of charts
  // up front locked the tab, and cards hidden at fetch-time (clientWidth 0,
  // e.g. after switching tabs mid-load) were skipped and never retried.
  var byTicker = {};
  results.forEach(function(r) { byTicker[r.ticker] = r; });
  var io = new IntersectionObserver(function(entries, obs) {
    entries.forEach(function(en) {
      if (!en.isIntersecting) return;
      obs.unobserve(en.target);
      loadCardChart(en.target, byTicker[en.target.dataset.ticker] || {});
    });
  }, { rootMargin: '400px' });
  container.querySelectorAll('.ccard-body').forEach(function(el) { io.observe(el); });
}

function levelLines(series, r) {
  // Screener-specific horizontal levels on the chart
  if (r.green_line) series.createPriceLine({ price: r.green_line, color: '#3fb950',
    lineWidth: 2, lineStyle: LightweightCharts.LineStyle.Dashed, axisLabelVisible: true, title: 'GL' });
  if (r.buy_point) series.createPriceLine({ price: r.buy_point, color: '#d29922',
    lineWidth: 1, lineStyle: LightweightCharts.LineStyle.Dashed, axisLabelVisible: true, title: 'BUY' });
}

function loadCardChart(el, r) {
  if (el.dataset.loaded || !el.dataset.ticker) return;
  el.dataset.loaded = '1';
  var ticker = el.dataset.ticker;
  getChart(ticker, gridInterval, gridRange)
    .then(function(ohlcv) {
      if (!ohlcv || ohlcv.error || !ohlcv.length) return;
      var clean = ohlcv.filter(function(d) { return d.open > 0 && d.high > 0 && d.low > 0 && d.close > 0; });
      if (!clean.length) return;

      var ch = LightweightCharts.createChart(el, {
        width: el.clientWidth || 380, height: 200,
        layout: { background: { color: '#161b22' }, textColor: '#8b949e' },
        grid: { vertLines: { color: '#1e252e' }, horzLines: { color: '#1e252e' } },
        crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
        rightPriceScale: { visible: false }, leftPriceScale: { visible: false },
        timeScale: { visible: false }, handleScroll: false, handleScale: false,
      });
      var candles = ch.addCandlestickSeries({
        upColor: '#3fb950', downColor: '#f85149',
        borderUpColor: '#3fb950', borderDownColor: '#f85149',
        wickUpColor: '#3fb950', wickDownColor: '#f85149',
        priceLineVisible: false, lastValueVisible: false,
      });
      candles.setData(clean.map(function(d) { return {time:d.time,open:d.open,high:d.high,low:d.low,close:d.close}; }));
      levelLines(candles, r);

      var vol = ch.addHistogramSeries({priceFormat:{type:'volume'},priceScaleId:'vol',priceLineVisible:false,lastValueVisible:false});
      ch.priceScale('vol').applyOptions({scaleMargins:{top:0.85,bottom:0}});
      vol.setData(clean.map(function(d) {
        return {time:d.time,value:d.volume,color:d.close>=d.open?'rgba(63,185,80,0.2)':'rgba(248,81,73,0.2)'};
      }));

      var cls = clean.map(function(d) { return d.close; });
      var ema8vals  = calcEMA(cls, 8);
      var ema21vals = calcEMA(cls, 21);
      var e8  = ch.addLineSeries({color:'#39d2e0',lineWidth:1.5,priceLineVisible:false,lastValueVisible:false,crosshairMarkerVisible:false});
      e8.setData(clean.map(function(d,i) { return {time:d.time,value:parseFloat(ema8vals[i].toFixed(2))}; }));
      var e21 = ch.addLineSeries({color:'#FF9800',lineWidth:1.5,priceLineVisible:false,lastValueVisible:false,crosshairMarkerVisible:false});
      e21.setData(clean.map(function(d,i) { return {time:d.time,value:parseFloat(ema21vals[i].toFixed(2))}; }));

      ch.timeScale().fitContent();
      new ResizeObserver(function() { ch.applyOptions({width:el.clientWidth}); }).observe(el);
    })
    .catch(function() {});
}

// ── Modal ─────────────────────────────────────────────────────────────────
var mChart = null, mTicker = null, mInterval = '1d', mRange = '6mo', mResizeObs = null, mLevels = null;

function openModal(ticker) {
  mTicker = ticker; mInterval = '1d'; mRange = '6mo';
  var tabResults = (activeTab && scanData[activeTab] && scanData[activeTab].results) || [];
  mLevels = tabResults.find(function(x) { return x.ticker === ticker; }) || {};
  document.getElementById('mtitle').textContent = ticker;
  document.getElementById('mtvlnk').href = 'https://www.tradingview.com/chart/?symbol=' + ticker;
  document.getElementById('moverlay').classList.add('open');
  document.querySelectorAll('#mtf .tf-btn').forEach(function(b) {
    var isIntGrp = b.closest('.tf-grp') === document.querySelector('#mtf .tf-grp:first-child');
    b.classList.toggle('active', isIntGrp ? b.dataset.interval === '1d' : b.dataset.range === '6mo');
  });
  loadModal();
}

function closeModal() {
  document.getElementById('moverlay').classList.remove('open');
  if (mChart) { mChart.remove(); mChart = null; }
  if (mResizeObs) { mResizeObs.disconnect(); mResizeObs = null; }
  mTicker = null;
}

document.getElementById('moverlay').addEventListener('click', function(e) {
  if (e.target === e.currentTarget) closeModal();
});
document.addEventListener('keydown', function(e) { if (e.key === 'Escape') closeModal(); });

document.getElementById('mtf').addEventListener('click', function(e) {
  var btn = e.target.closest('.tf-btn');
  if (!btn || !mTicker) return;
  var grp = btn.closest('.tf-grp');
  var isInt = grp === document.querySelector('#mtf .tf-grp:first-child');
  if (isInt) {
    mInterval = btn.dataset.interval;
    mRange    = btn.dataset.range;
    grp.querySelectorAll('.tf-btn').forEach(function(b) { b.classList.remove('active'); });
    btn.classList.add('active');
    grp.nextElementSibling.querySelectorAll('.tf-btn').forEach(function(b) {
      b.classList.toggle('active', b.dataset.range === mRange);
    });
  } else {
    mRange = btn.dataset.range;
    grp.querySelectorAll('.tf-btn').forEach(function(b) { b.classList.remove('active'); });
    btn.classList.add('active');
  }
  loadModal();
});

async function loadModal() {
  var container = document.getElementById('mchart');
  container.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100%"><div class="mspin"></div></div>';
  if (mResizeObs) { mResizeObs.disconnect(); mResizeObs = null; }
  if (mChart) { mChart.remove(); mChart = null; }
  try {
    var data = await getChart(mTicker, mInterval, mRange);
    if (!data.length) throw new Error('No data returned');
    container.innerHTML = '';
    mChart = LightweightCharts.createChart(container, {
      width: container.clientWidth, height: 480,
      layout: { background: { color: '#161b22' }, textColor: '#8b949e' },
      grid: { vertLines: { color: '#1e252e' }, horzLines: { color: '#1e252e' } },
      crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
      rightPriceScale: { borderColor: '#30363d' },
      timeScale: { borderColor: '#30363d', timeVisible: false },
    });
    var cs = mChart.addCandlestickSeries({
      upColor:'#3fb950',downColor:'#f85149',borderUpColor:'#3fb950',borderDownColor:'#f85149',
      wickUpColor:'#3fb950',wickDownColor:'#f85149',
    });
    cs.setData(data.map(function(d) { return {time:d.time,open:d.open,high:d.high,low:d.low,close:d.close}; }));
    levelLines(cs, mLevels || {});
    var vs = mChart.addHistogramSeries({priceFormat:{type:'volume'},priceScaleId:'vol',priceLineVisible:false,lastValueVisible:false});
    mChart.priceScale('vol').applyOptions({scaleMargins:{top:0.85,bottom:0}});
    vs.setData(data.map(function(d) {
      return {time:d.time,value:d.volume,color:d.close>=d.open?'rgba(63,185,80,0.25)':'rgba(248,81,73,0.25)'};
    }));
    var cls = data.map(function(d) { return d.close; });
    var e8  = mChart.addLineSeries({color:'#39d2e0',lineWidth:2,priceLineVisible:false,lastValueVisible:false,crosshairMarkerVisible:false});
    e8.setData(data.map(function(d,i) { return {time:d.time,value:parseFloat(calcEMA(cls,8)[i].toFixed(2))}; }));
    var e21 = mChart.addLineSeries({color:'#FF9800',lineWidth:2,priceLineVisible:false,lastValueVisible:false,crosshairMarkerVisible:false});
    e21.setData(data.map(function(d,i) { return {time:d.time,value:parseFloat(calcEMA(cls,21)[i].toFixed(2))}; }));
    mChart.timeScale().fitContent();
    mResizeObs = new ResizeObserver(function() { if (mChart) mChart.applyOptions({width:container.clientWidth}); });
    mResizeObs.observe(container);
  } catch(e) {
    container.innerHTML = '<div style="color:var(--red);padding:20px">Chart error: ' + e.message + '</div>';
  }
}
</script>
